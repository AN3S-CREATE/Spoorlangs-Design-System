<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SiteFooter — preview</title>
<style>
  /* layout of the states only — the component is styled by bundle.css */
  .ds-states { display: grid; gap: 24px; padding: 24px 0; }
  .ds-state-label { margin: 0 0 8px; padding: 0 24px; font: 700 11px/1.4 var(--font-sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted-foreground); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var S = window.Spoorlangs, h = React.createElement;
  var LOGO = '/_blob/694452e8b7ac21fa9d74d9e25d09ff34'; /* assets/Logos/monochrome-white.png — the site's footer logo */
  function state(label, node) {
    return h('section', null, h('p', { className: 'ds-state-label' }, label), node);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'ds-states' },
      state('Default — every page',
        h(S.SiteFooter, {
          logoSrc: LOGO,
          logoAlt: 'Spoorlangs · drive@spoorlangs.online · +27 66 271 5887',
          tagline: 'Driven By People. Further Together.',
          location: 'Kempton Park',
          whatsappHref: 'https://wa.me/27662715887?text=Hi%20Spoorlangs%20%E2%80%94%20quote%20request',
          whatsappNumber: '+27 66 271 5887',
          whatsappAriaLabel: 'WhatsApp +27 66 271 5887',
          email: 'drive@spoorlangs.online',
          hours: 'Message any time · Nico replies from 07:30 · we confirm your window.',
          mantra: 'SOUTH AFRICA KEEPS MOVING',
          links: [
            { label: 'Contact details', href: '/contact' },
            { label: 'Privacy policy', href: '/privacy' }
          ],
          copyright: '© 2026 Spoorlangs (Pty) Ltd'
        })
      ),
      state('On /contact — "Contact details" carries class="active" aria-current="page" (no rule styles it)',
        h(S.SiteFooter, { logoSrc: LOGO, currentPath: '/contact' })
      )
    )
  );
</script>
</body>
</html>
