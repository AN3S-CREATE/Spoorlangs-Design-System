<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Eyebrow — preview</title>
<style>
  /* Layout of the states only — the component is styled by bundle.css. */
  .states { display:flex; flex-direction:column; gap:24px; padding:24px; background:var(--background); font-family:var(--font-sans); }
  .preview-band { background:var(--orange); padding:24px; border-top:0; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var S = window.Spoorlangs, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'states' },
      h(S.Eyebrow, null, 'Gauteng on-wheels'),
      h(S.Eyebrow, { variant: 'hero-kicker' }, 'Driver-powered vehicle relocation'),
      h(S.Eyebrow, null, 'Kempton Park · Gauteng vehicle delivery'),
      h('div', { className: 'services-cta preview-band' },
        h(S.Eyebrow, null, 'Not sure which service fits?')
      )
    )
  );
</script>
</body>
</html>
