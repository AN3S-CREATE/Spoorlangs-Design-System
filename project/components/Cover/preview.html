<title>Spoorlangs</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--background); color:var(--foreground); font-family:var(--font-brand-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  /* the composition: a 480-wide box on the right half of the 960 layout, clear of the name */
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  /* blocks: the Brand Book's named colours (p14), corners "Cards 16 px" (p22) */
  .ignition { fill:var(--ignition-orange); }
  .copper { fill:var(--burnt-copper); }
  .titanium { fill:var(--titanium-silver); }
  .steel { fill:var(--steel-grey); }
  .blk { rx:var(--radius-card); }
  /* the speedometer arc (p18): titanium segments, ignition red-zone, titanium ticks */
  .seg { fill:none; stroke:var(--titanium-silver); stroke-width:var(--step-16); }
  .seg.red { stroke:var(--ignition-orange); }
  .tick { stroke:var(--titanium-silver); stroke-width:var(--line-2); }
  /* name and tagline, bottom-left on the ground, inset by the book's 24 px gutter (p22) */
  .words { position:absolute; left:var(--step-24); bottom:var(--step-24); max-width:440px; }
  .name { margin:0; font-family:var(--font-brand-display); font-weight:400; font-size:72px; line-height:.95; text-transform:uppercase; color:var(--foreground); }
  .tag { margin:var(--step-8) 0 0; font-family:var(--font-brand-sans); font-weight:500; font-size:14px; line-height:1.5; color:var(--muted-foreground); }
</style>
</head>

<!--
  blocks      ignition-orange 192×280 column at x=336, bled off the right and bottom (visible 144×264) — first and largest, the hue the brand is known by ("orange = motion", p05) · titanium-silver 288×72 band ("metallic = premium") · burnt-copper 168×112 set into the column's lower corner, bled off right and bottom (visible 120×96 — "Hover and depth on orange only", p15: copper never leaves the orange) · steel-grey 144×88 bled off the bottom inside the dial (visible 144×72 — "Rules, dividers, muted UI") — together ≈25% of 960×288; the asphalt ground (background) is the deep surface, 70% of the book's ratio (p15)
  arrangement one tall slab with satellites: the ignition column holds the right edge, the titanium band runs flush with its top across the top-left (step-24 gutter between them), the copper block sits a step-24 in from the column's edge as its depth, the dial rises from the bottom edge between band and column with its red-zone a step-8 short of the orange; nothing crosses x < 480 but the words
  pattern     the literal-motif row — the speedometer arc, "SPEEDOMETER ARC — Segmented silver ring with orange red-zone. Section heads, progress, gauges." (p18; the logo's anatomy, p09) — chosen over the loud-poster stripes/chevrons because p18 forbids them ("No chequered flags, decorative flames, racing stripes…") and a segmented titanium ring ending in an ignition red-zone is the one shape only Spoorlangs owns: 5 titanium segments step-48 long at step-8 gaps, a step-8 gap, 11 ignition-orange segments step-8 long at step-8 gaps, 23 titanium ticks step-16 long at a step-16 pitch on the inner row — 39 units, no needle (shapes, not pictures)
  scales      ring radius 144 = step-96 + step-48, its outer edge on the step-24 gutter, centre on the bottom edge; ring stroke step-16; ticks stroke line-2 ("Lines: 1–2 px steel or titanium", p22) on the row r 112–128, a step-8 inside the ring; block sides 192/280/288/72/168/112/144/88 (8-pt multiples); corners radius-card ("Cards 16 px", p22); insets step-24; name 72px inside the DISPLAY web range "64–96 px" (p17) set in brand-display (Bebas Neue, Oswald fallback — the p16 specimen "SPOORLANGS"), caps as "headings in caps" (p17), leading .95 (site h1,h2,h3), no tracking value stated ("light tracking", p16 — gap); tagline brand-caption 14px/500 in muted-foreground, copy verbatim from the book's cover (p01) and the site's hero strip
