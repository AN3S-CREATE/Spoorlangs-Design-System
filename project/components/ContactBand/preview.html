<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ContactBand — preview</title>
<style>
  /* layout of the states only — the component is styled by bundle.css */
  .ds-states { display: grid; gap: 24px; padding: 24px 0; }
  .ds-state-label { margin: 0 0 8px; padding: 0 24px; font: 700 11px/1.4 var(--font-sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted-foreground); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var S = window.Spoorlangs, h = React.createElement;
  var WA_HREF = 'https://wa.me/27662715887?text=Hi%20Spoorlangs%20%E2%80%94%20quote%20request'; /* the site's prefilled wa.me link */
  var IMAGE = '/_blob/29632c489d9de9b3e035b868a4b1c6a1'; /* assets/Imagery/contact-cta.png (2752×1536) */
  function state(label, node) {
    return h('section', null, h('p', { className: 'ds-state-label' }, label), node);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'ds-states' },
      state('Default — home #contact, the last section before the footer (every prop is the site\'s copy)',
        h(S.ContactBand, {
          imageSrc: IMAGE,
          imageAlt: 'Get a Spoorlangs vehicle delivery quote',
          eyebrow: 'Kempton Park · Gauteng vehicle delivery',
          title: 'Every vehicle deserves a professional journey.',
          titleId: 'contact-title',
          hours: 'Message any time · Nico replies from 07:30 · we confirm your window.',
          actions: [
            { variant: 'primary', href: WA_HREF, target: '_blank', rel: 'noreferrer', 'aria-label': 'WhatsApp +27 66 271 5887', icon: 'message-circle', label: 'WhatsApp us', trailingIcon: 'arrow-right' },
            { variant: 'secondary', href: 'mailto:drive@spoorlangs.online', icon: 'mail', label: 'drive@spoorlangs.online', wrapLabel: false },
            { variant: 'secondary', href: '/quote?service=&pickup=', label: 'Get a quote' },
            { variant: 'secondary', href: '/contact', label: 'Contact details' }
          ]
        })
      ),
      state('Two actions, hours omitted (hours: null) — WhatsApp primary and the quote link only',
        h(S.ContactBand, {
          id: 'contact-two',
          titleId: 'contact-two-title',
          imageSrc: IMAGE,
          imageAlt: 'Get a Spoorlangs vehicle delivery quote',
          hours: null,
          actions: [
            { variant: 'primary', href: WA_HREF, target: '_blank', rel: 'noreferrer', 'aria-label': 'WhatsApp +27 66 271 5887', icon: 'message-circle', label: 'WhatsApp us', trailingIcon: 'arrow-right' },
            { variant: 'secondary', href: '/quote?service=&pickup=', label: 'Get a quote' }
          ]
        })
      ),
      state('children — one ContactBandAction with the Brand Book p08 CTA microcopy "Get a quote on WhatsApp" (site says "WhatsApp us" — for Andries Liebenberg)',
        h(S.ContactBand, { id: 'contact-children', titleId: 'contact-children-title', imageSrc: IMAGE, imageAlt: 'Get a Spoorlangs vehicle delivery quote' },
          h(S.ContactBandAction, { href: WA_HREF, target: '_blank', rel: 'noreferrer', 'aria-label': 'WhatsApp +27 66 271 5887', icon: 'message-circle', trailingIcon: 'arrow-right' }, 'Get a quote on WhatsApp')
        )
      )
    )
  );
</script>
</body>
</html>
